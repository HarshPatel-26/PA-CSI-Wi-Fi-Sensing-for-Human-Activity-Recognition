[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-csi"
version = "0.1.0"
description = "Wi-Fi CSI human activity recognition using phase and amplitude features"
requires-python = ">=3.10,<3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
